services:
  postgres:
    image: postgres:16-alpine
    container_name: apuestas-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apuestas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apuestas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-apuestas_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Solo corre con un volumen vacío; si ya existía, usar `pnpm db:reset`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apuestas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apuestas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bandeja SMTP de desarrollo: los correos de la app se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: apuestas-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
